entity.user=User

# Outbound authentication mail. {0} is always the recipient's username.
# Plain text: a one-time code has to be copied accurately, and plain text survives every mail client,
# screen reader and spam filter intact.
mail.login_code.subject=Your AtomList sign-in code
mail.login_code.body=Hello {0},\n\n\
  Here is your sign-in code:\n\n\
  \    {1}\n\n\
  Type or copy and paste it into the sign-in page. The spaces are only there to make it easier to read - you can ignore them.\n\n\
  The code stops working in {2} minutes. If you did not ask to sign in, you can ignore this message.\n\n\
  AtomList
mail.email_verification.subject=Confirm your AtomList email address
mail.email_verification.body=Hello {0},\n\n\
  An AtomList account has been created for you. Confirm this address to finish setting it up:\n\n\
  \    {1}\n\n\
  You will not need a password. Every time you sign in, we will email you a single-use code instead.\n\n\
  The link works for the next {2} hours. If you were not expecting this message, please tell your administrator.\n\n\
  AtomList
