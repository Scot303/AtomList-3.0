app:
  security:
    # Over http://localhost a "__Secure-" cookie is dropped by the browser and SameSite=None is
    # refused without Secure, so both have to be relaxed here. Frontend and API are the same site
    # locally (a differing port does not change that), which is what makes Lax workable.
    refresh-cookie:
      name: refreshToken
      secure: false
      same-site: Lax
