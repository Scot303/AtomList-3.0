server:
  port: ${SERVER_PORT:8080}
  # Railway terminates TLS at its edge and forwards over plain HTTP. Without this the app sees
  # scheme "http" and its own internal host, which breaks generated URLs and Secure-cookie handling.
  #
  # The filter this installs also hides the X-Forwarded-* headers from everything downstream and
  # rewrites getRemoteAddr() to the *leftmost* X-Forwarded-For entry, which the caller controls.
  # RateLimitFilter#unwrap exists solely to get behind that; see the note there before touching either.
  forward-headers-strategy: framework

spring:
  application:
    name: atomlist-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Managed Postgres plans cap total connections low, and the cap is shared with everything else
      # touching the database (migrations, a psql session, the old instance during a rolling deploy).
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIME_ZONE:Europe/Warsaw}
    show-sql: true
    # Keeps transaction boundaries at the service layer instead of holding a connection open for the whole request while the response serializes.
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # Zone every clock calculation is anchored to, independent of the JVM default.
  time-zone: ${APP_TIME_ZONE:Europe/Warsaw}
  lists:
    auto-create: ${LISTS_AUTO_CREATE:true}
  discounts:
    seed-defaults: ${DISCOUNTS_SEED_DEFAULTS:true}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:atomlist-app}
    access-token-ttl: ${ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:10d}
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:__Secure-refreshToken}
      path: ${REFRESH_COOKIE_PATH:/api/auth}
      secure: ${REFRESH_COOKIE_SECURE:true}
      # Lax requires the frontend and the API to share a registrable domain.
      #   prod backend -> Lax
      #   dev backend -> None
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      # Empty means host-only: the cookie belongs to the API hostname and nothing else.
      # Setting .atomlist.pl would broadcast it to every subdomain, the frontend included,
      # which has no use for a cookie it cannot read and must not send anywhere but /api/auth.
      domain: ${REFRESH_COOKIE_DOMAIN:}
    # Passwordless sign-in. Every value has a working default; see LoginPolicyProperties.
    login:
      code:
        length: ${LOGIN_CODE_LENGTH:16}
        ttl: ${LOGIN_CODE_TTL:15m}
        resend-cooldown: ${LOGIN_CODE_RESEND_COOLDOWN:60s}
        max-attempts: ${LOGIN_CODE_MAX_ATTEMPTS:5}
      lockout:
        max-failed-attempts: ${LOGIN_LOCKOUT_MAX_ATTEMPTS:10}
        duration: ${LOGIN_LOCKOUT_DURATION:60m}
      email-verification:
        ttl: ${EMAIL_VERIFICATION_TTL:1d}
        resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:5m}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      capacity: ${RATE_LIMIT_CAPACITY:10}
      refill-period: ${RATE_LIMIT_REFILL_PERIOD:1m}
      # Reverse-proxy hops in front of the app. 0 = trust the socket address only.
      #   prod backend -> 1
      #   dev backend  -> 1
      # Proxying api.atomlist.pl through Cloudflare (orange cloud) would add a hop and make it 2.
      # Setting this higher than the real hop count lets callers forge their own source address and evade the limiter.
      trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
    from-name: ${MAIL_FROM_NAME:AtomList}
    resend:
      # Unset means mail is written to the log instead of being sent, which the 'prod' profile refuses to start with.
      api-key: ${RESEND_API_KEY:}
    # A frontend address, not an API one - the page it opens is what posts the token to /api/auth/email/verify.
    # {token} is substituted.
    #
    # One absolute URL, so it has to name a single deployment - and it must be a frontend that talks
    # to *this* backend, or the token gets posted to the wrong instance and reads as invalid:
    #   prod backend -> https://atomlist.pl/verify-email?token={token}
    #   dev backend -> https://dev.atomlist.pl/verify-email?token={token}
    verification-url: ${MAIL_VERIFICATION_URL:http://localhost:5173/verify-email?token={token}}
  cors:
    # Comma-separated list of browser origins allowed to call this API with credentials.
    #   prod backend -> https://atomlist.pl,https://www.atomlist.pl
    #   dev backend -> https://dev.atomlist.pl,https://www.dev.atomlist.pl,http://localhost:5173,http://127.0.0.1:5173
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
  sms:
    schedule.reminder:
      enabled: ${SMS_SCHEDULE_REMINDER_ENABLED:false}
      cron: ${SMS_SCHEDULE_REMINDER_CRON}:"0 0 13 15 * *"}
    rest:
      justSend:
        url: ${JUSTSEND_API_URL}:"https://justsend.io/api/"}
        apiKey: ${JUSTSEND_API_KEY:}

    # represent as numbers with ',' delimiter, ex.: "48123456789, 48987654321"
    phoneWhitelist: ${PHONE_WHITELIST:}