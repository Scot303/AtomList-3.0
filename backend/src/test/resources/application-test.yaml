spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

app:
  lists:
    auto-create: false
  discounts:
    # Off so each test states the discount ladder it expects.
    seed-defaults: false
  security:
    jwt-secret: test-only-secret-that-is-comfortably-over-thirty-two-bytes
    jwt-issuer: atomlist-test
    access-token-ttl: 10m
    refresh-token-ttl: 1d
    refresh-cookie:
      name: refreshToken
      secure: false
      same-site: Lax
    login:
      code:
        # Expiry is tested by aging the stored row, not by sleeping.
        ttl: 10m
        # Off, so a test can ask for a second code without waiting.
        resend-cooldown: 0s
        max-attempts: 3
      lockout:
        max-failed-attempts: 5
        duration: 10m
      email-verification:
        resend-cooldown: 0s
    rate-limit:
      # Off by default so the auth tests can sign in repeatedly.
      enabled: false
  cors:
    allowed-origin-patterns: http://localhost:5173

logging:
  level:
    org.hibernate.SQL: warn
